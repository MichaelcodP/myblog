server {
    listen 80;
    server_name _;  # Replace with your domain: example.com www.example.com
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Main application
    location / {
        proxy_pass http://unix:/home/myblog/myblog_project/myblog.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Static files (CSS, JS, images)
    location /static/ {
        alias /home/myblog/myblog_project/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Security for static files
        location ~* \.(php|py|pl|rb|sh|cgi)$ {
            deny all;
        }
    }
    
    # Media files (user uploads)
    location /media/ {
        alias /home/myblog/myblog_project/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        
        # Limit file size
        client_max_body_size 10M;
        
        # Security for media files
        location ~* \.(php|py|pl|rb|sh|cgi)$ {
            deny all;
        }
    }
    
    # Favicon
    location = /favicon.ico {
        alias /home/myblog/myblog_project/staticfiles/favicon.ico;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Robots.txt
    location = /robots.txt {
        alias /home/myblog/myblog_project/staticfiles/robots.txt;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ \.(ini|log|conf)$ {
        deny all;
    }
    
    # Rate limiting for API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://unix:/home/myblog/myblog_project/myblog.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Rate limiting configuration
http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
}
